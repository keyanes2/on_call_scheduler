<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ILM Automated On-Call Scheduler</title>
<style>
:root{--navy:#13233f;--blue:#17375e;--orange:#f58220;--line:#aab4c3;--soft:#eef3f8;--red:#f4cccc;--holiday:#ffe699;--shift:#c6e0b4;--oncall:#bdd7ee;--ink:#1f2937}
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:var(--ink);font:14px Arial,sans-serif}.app{max-width:1500px;margin:auto;padding:20px}.panel{background:#fff;border:1px solid #d9e0e8;border-radius:10px;box-shadow:0 2px 10px #0001;margin-bottom:16px;overflow:hidden}.topbar{background:linear-gradient(100deg,#07172e,#17375e);color:#fff;padding:18px 22px;display:flex;align-items:center;gap:18px}.brand{font-weight:800;font-size:30px;letter-spacing:2px;color:#ff9b57}.topbar h1{font-size:20px;margin:0}.topbar p{opacity:.8;margin:4px 0 0}.form{padding:18px;display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:12px}.wide{grid-column:span 2}.full{grid-column:1/-1}label{display:block;font-weight:700;font-size:12px;margin:0 0 6px;color:#445}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid #b8c2cf;border-radius:6px;padding:9px;background:#fff}textarea{min-height:72px}.buttons{padding:0 18px 18px;display:flex;flex-wrap:wrap;gap:8px}button{border:0;border-radius:6px;padding:10px 14px;font-weight:700;cursor:pointer;background:#e6ebf1;color:#213047}button.primary{background:var(--orange);color:#fff}button.dark{background:var(--blue);color:#fff}button.danger{background:#b42318;color:#fff}.hint{font-size:12px;color:#667085;padding:0 18px 16px}.schedule-wrap{padding:16px;overflow:visible}.table-slider{width:100%;overflow-x:auto;overflow-y:hidden;margin-bottom:8px;padding-bottom:10px;scrollbar-gutter:stable}.table-slider::-webkit-scrollbar,.preview-scroll::-webkit-scrollbar{height:14px}.table-slider::-webkit-scrollbar-track,.preview-scroll::-webkit-scrollbar-track{background:#e5e7eb;border-radius:10px}.table-slider::-webkit-scrollbar-thumb,.preview-scroll::-webkit-scrollbar-thumb{background:#7b8794;border-radius:10px;border:3px solid #e5e7eb}.table-slider::-webkit-scrollbar-thumb:hover,.preview-scroll::-webkit-scrollbar-thumb:hover{background:#4b5563}.section-title{background:var(--blue);color:white;padding:9px 12px;font-size:14px;font-weight:800;position:sticky;left:0}.schedule{border-collapse:collapse;table-layout:fixed;min-width:1200px;width:100%;margin-bottom:18px}.schedule th,.schedule td{border:1px solid var(--line);text-align:center;padding:0;height:38px;min-width:58px}.schedule th{background:#dbe5f1;font-size:11px}.schedule .name{position:sticky;left:0;z-index:2;background:#fff;min-width:190px;width:190px;text-align:left;padding:7px;font-weight:700}.schedule th.name{background:#dbe5f1;z-index:3}.schedule select{width:100%;height:37px;border:0;border-radius:0;background:transparent;padding:2px;text-align:center}.schedule select:focus{outline:2px solid var(--orange);outline-offset:-2px}.schedule td.name[contenteditable]{outline:none}.schedule td.name[contenteditable]:focus{box-shadow:inset 0 0 0 2px var(--orange)}.weekend{background:#f2f2f2!important}.holiday{background:var(--holiday)!important;font-weight:700}.leave{background:var(--red)!important;font-weight:700}.oncall{background:var(--oncall)!important}.shiftchg{background:var(--shift)!important}.rowtools{display:flex;gap:5px;padding:6px 0 12px}.legend{display:flex;flex-wrap:wrap;gap:10px;padding:4px 0 16px}.key{display:flex;align-items:center;gap:6px}.swatch{width:24px;height:16px;border:1px solid #888}.preview-shell{padding:18px}.email{border:1px solid #aab4c3;background:#fff}.email-head{padding:12px 16px;border-bottom:1px solid #ccd3dc}.email-head div{margin:5px 0}.email-body{padding:0 18px 18px}.mail-banner{background:#fff;color:#000;margin:0 -18px 14px;padding:24px 18px 8px;border-bottom:2px solid #222}.preview-header{display:flex;align-items:center;justify-content:space-between;gap:24px}.preview-header-title{min-width:0}.preview-header-title .main{font-size:34px;line-height:1.05;font-weight:800}.preview-header-title .sub{font-size:20px;line-height:1.25;margin-top:6px}.preview-header-brand{display:flex;align-items:center;gap:12px;flex:0 0 auto}.preview-dxc{font-size:42px;font-weight:800;letter-spacing:3px;font-style:italic;background:linear-gradient(90deg,#5b96f5,#ff8758 38%,#ff995c 68%,#5b96f5);-webkit-background-clip:text;background-clip:text;color:transparent}.preview-partner{font-size:10px;line-height:1.15;font-weight:700;white-space:nowrap}@media(max-width:700px){.preview-header{align-items:flex-start;flex-direction:column}.preview-header-title .main{font-size:28px}.preview-header-title .sub{font-size:17px}.preview-dxc{font-size:34px}}.announcement{display:grid;grid-template-columns:170px 1fr;border:1px solid #aab4c3;margin-bottom:14px}.announcement>div{padding:12px}.announcement>div:first-child{background:#dbe5f1;font-weight:800}.preview-table{border-collapse:collapse;font-size:10px;min-width:1050px;width:100%;margin:8px 0 14px}.preview-table th,.preview-table td{border:1px solid #7f8c9b;text-align:center;padding:3px}.preview-table th:first-child,.preview-table td:first-child{text-align:left;min-width:155px}.preview-scroll{width:100%;overflow-x:auto;overflow-y:hidden;padding-bottom:10px;scrollbar-gutter:stable}.preview-category-header{margin:14px 0 0;padding:9px 12px;color:#fff;font-size:14px;font-weight:800}.preview-category-header.l23{background:#1f4068}.preview-category-header.l4{background:#f58220}.preview-category-header.jfc{background:#111827}.preview-category-header.tke{background:#6b3fa0}.notice{padding:10px;border-radius:6px;background:#fff4e5;color:#8a4b08;margin:0 18px 18px}.status{padding:10px 18px;font-weight:700}.footer{font-size:10px;color:#667085;padding-top:14px}@media(max-width:850px){.form{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}}@media(max-width:540px){.form{grid-template-columns:1fr}.wide{grid-column:auto}}

/* Added only to show the complete selected time/status text in editable schedule cells. */
.schedule th:not(.name),.schedule td:not(.name){min-width:88px;width:88px}
.schedule td:not(.name){height:48px}
.schedule td:not(.name) select{
  width:100%;
  min-width:0;
  height:47px;
  padding:4px 20px 4px 5px;
  font-size:13px;
  line-height:18px;
  white-space:normal;
  overflow:visible;
  text-overflow:clip;
  word-break:normal;
  overflow-wrap:break-word;
}
.schedule td:not(.name) select option{
  white-space:normal;
  overflow-wrap:anywhere;
}
</style>
</head><body><div class="app">
<section class="panel"><div class="topbar"><div class="brand">DXC</div><div><h1>Automated On-Call Scheduler</h1><p>Information Lifecycle Management</p></div></div>
<div class="form">
<div><label>Schedule month</label><input id="month" type="month"></div><div><label>Update label</label><input id="update" value="1st Update"></div>
<div><label>Team Host</label><input id="host" value="Kia and Leslie"></div><div><label>Team Meeting Date</label><input id="meetingDate" type="date"></div>
<div class="wide"><label>Recipient work email(s)</label><input id="recipients" placeholder="name@company.com; another@company.com"></div><div class="wide"><label>Email subject</label><input id="subject"></div>
<div class="full"><label>Announcements / Reminders</label><textarea id="announcements">• Please review the on-call schedule below.
• Refer to this email as this is not yet plotted in DXC Time.
• If there is a need to swap schedules, please consult the affected DMs first at least 3-5 days lead time to the scheduled date(s) affected.
• Message me if you have any concerns.</textarea></div>
</div><div class="buttons"><button type="button" class="dark" onclick="buildAll()">Auto-Populate Schedule</button><button type="button" class="danger" onclick="clearSchedule()">Clear Schedule</button><button type="button" onclick="generateEmailPreview()">Generate Email Preview</button><button type="button" class="primary" onclick="submitSchedule()">Send Schedule</button></div><div class="hint">Blank schedule fields are allowed. Select a value from each schedule dropdown. Send Schedule opens a prefilled Outlook email for review.</div><div id="status" class="status"></div></section>
<section class="panel"><div class="schedule-wrap" id="tables"></div></section>
<section class="panel" id="emailPreviewSection"><div class="preview-shell"><h2>Email Preview</h2><div id="preview"></div></div></section>
</div>
<script>
const l23=['Anes, Kia Marie','Almojuela, Jayvee','Gonzaga, Edgar Reginald','Luz, Roel Anthony','Marasigan, Diane Claire','Patio, Jannah Patrize','Rosario, Julian','De Guzman, Beverly','Catmunan, Clarence Antonio','Gueta, Leslie','Rodriguez, Ralph'];
const groups=[
{id:'l23',title:'ILM L2/L3',members:l23},
{id:'l4',title:'SPE/ILM L4',members:['Abuel, Jarold','Garbi, Rose','Galolo, Jethro','Maano, Mar Neil','Valerio, Louis','Galeno, Ryan','Yusing, Camille','Cruz, Arvin']},
{id:'jfc',title:'JFC Oncall',members:['Gonzaga, Edgar Reginald','Marasigan, Diane Claire','Patio, Jannah Patrize']},
{id:'tke',title:'TKE Daily Monitoring',members:['Patio, Jannah Patrize','Cruz, Arvin','Rosario, Julian']}
];
const defaults={
'Anes, Kia Marie':'14:00','Almojuela, Jayvee':'22:00','Gonzaga, Edgar Reginald':'6:00','Luz, Roel Anthony':'14:00','Marasigan, Diane Claire':'14:00','Patio, Jannah Patrize':'7:00','Rosario, Julian':'14:00','De Guzman, Beverly':'21:00','Catmunan, Clarence Antonio':'14:00','Gueta, Leslie':'14:00','Rodriguez, Ralph':'14:00',
'Abuel, Jarold':'7:00','Garbi, Rose':'14:00','Galolo, Jethro':'14:00','Maano, Mar Neil':'20:00','Valerio, Louis':'14:00','Galeno, Ryan':'14:00','Yusing, Camille':'14:00','Cruz, Arvin':'15:00'};
const tke={'Patio, Jannah Patrize':'3 - 4 pm','Cruz, Arvin':'4 - 6 pm','Rosario, Julian':'6 - 7 pm'};
let selectedCell=null;
function init(){let d=new Date(); document.querySelector('#month').value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;document.querySelector('#meetingDate').valueAsDate=d;buildAll()}
function monthInfo(){const [y,m]=document.querySelector('#month').value.split('-').map(Number);return {y,m,days:new Date(y,m,0).getDate(),label:new Date(y,m-1,1).toLocaleString('en-US',{month:'long',year:'numeric'})}}
function autoValue(g,name,day){const {y,m}=monthInfo(),dow=new Date(y,m-1,day).getDay();if(dow===0||dow===6)return '';if(g.id==='tke')return tke[name]||'';if(g.id==='jfc'){return name.includes('Gonzaga')?'8:00':name.includes('Marasigan')?'14:00':'7:00'} return defaults[name]||'14:00'}
function buildAll(){const {days}=monthInfo();const box=document.querySelector('#tables');box.innerHTML='';groups.forEach(g=>{let wrap=document.createElement('div');wrap.dataset.group=g.id;let html=`<div class="section-title">${g.title}</div><div class="table-slider"><table class="schedule"><thead><tr><th class="name">NAME</th>`;for(let d=1;d<=days;d++){let dow=new Date(monthInfo().y,monthInfo().m-1,d);html+=`<th class="${[0,6].includes(dow.getDay())?'weekend':''}">${d}<br>${dow.toLocaleDateString('en-US',{weekday:'short'}).toUpperCase()}</th>`}html+='</tr></thead><tbody>';g.members.forEach(n=>{html+=rowHtml(g,n,days)});html+='</tbody></table></div><div class="rowtools"><button onclick="addCustom(\''+g.id+'\')">+ Add member</button></div>';wrap.innerHTML=html;box.appendChild(wrap)});wireCells();syncSubject();renderPreview()}
function optionsFor(value,groupId){
 const base=['','6:00','7:00','8:00','14:00','15:00','19:00','20:00','21:00','22:00','3 - 4 pm','4 - 6 pm','6 - 7 pm','SL','VL/CDO','H','FF'];
 if(value&&!base.includes(value))base.splice(1,0,value);
 return base.map(v=>`<option value="${escapeHtml(v)}" ${v===value?'selected':''}>${v||'Blank'}</option>`).join('');
}
function rowHtml(g,n,days){let s=`<tr data-name="${escapeHtml(n)}"><td class="name" contenteditable="true">${escapeHtml(n)}</td>`;for(let d=1;d<=days;d++){let dow=new Date(monthInfo().y,monthInfo().m-1,d).getDay(),v=autoValue(g,n,d);s+=`<td data-day="${d}" class="${[0,6].includes(dow)?'weekend ':''}${v?'oncall':''}"><select aria-label="${escapeHtml(n)} day ${d}" onchange="styleScheduleCell(this);renderPreview()">${optionsFor(v,g.id)}</select></td>`}return s+'</tr>'}
function wireCells(){document.querySelectorAll('.schedule td.name[contenteditable]').forEach(c=>c.oninput=renderPreview);document.querySelectorAll('.schedule select').forEach(styleScheduleCell)}
function styleScheduleCell(sel){const td=sel.parentElement;['leave','holiday','shiftchg','oncall'].forEach(x=>td.classList.remove(x));const v=sel.value;if(v==='SL'||v==='VL/CDO')td.classList.add('leave');else if(v==='H')td.classList.add('holiday');else if(v)td.classList.add('oncall')}
function clearSchedule(){document.querySelectorAll('.schedule select').forEach(sel=>{sel.value='';styleScheduleCell(sel)});renderPreview();msg('Schedule cleared. Names and dates were retained.',true)}
function syncSubject(){let {label}=monthInfo();document.querySelector('#subject').value=`[FYI][ILM][RM] On-call Schedule for ${label} - ${document.querySelector('#update').value}`}
function collect(){return groups.map(g=>{let root=document.querySelector(`[data-group="${g.id}"]`);return {title:g.title,rows:[...root.querySelectorAll('tbody tr')].map(r=>({name:r.children[0].innerText.trim(),cells:[...r.children].slice(1).map(c=>({text:c.querySelector('select')?.value||'',cls:c.className}))}))}})}
function tablePreview(g){let {days,y,m}=monthInfo(),categoryClass=g.title==='ILM L2/L3'?'l23':g.title==='SPE/ILM L4'?'l4':g.title==='JFC Oncall'?'jfc':'tke',h=`<div class="preview-category-header ${categoryClass}">${g.title}</div><div class="preview-scroll"><table class="preview-table"><tr><th>NAME</th>`;for(let d=1;d<=days;d++){let dt=new Date(y,m-1,d);h+=`<th>${d}<br>${dt.toLocaleDateString('en-US',{weekday:'short'}).toUpperCase()}</th>`}h+='</tr>';g.rows.forEach(r=>{h+=`<tr><td><b>${escapeHtml(r.name)}</b></td>`;r.cells.forEach(c=>{let bg=c.cls.includes('leave')?'#f4cccc':c.cls.includes('holiday')?'#ffe699':c.cls.includes('shiftchg')?'#c6e0b4':c.cls.includes('oncall')?'#bdd7ee':c.cls.includes('weekend')?'#f2f2f2':'#fff';h+=`<td style="background:${bg}">${escapeHtml(c.text)}</td>`});h+='</tr>'});return h+'</table></div>'}
function renderPreview(){syncSubject();let data=collect(),{label}=monthInfo(),host=escapeHtml(document.querySelector('#host').value),md=document.querySelector('#meetingDate').value,ann=escapeHtml(document.querySelector('#announcements').value).replace(/\n/g,'<br>'),to=escapeHtml(document.querySelector('#recipients').value),sub=escapeHtml(document.querySelector('#subject').value);document.querySelector('#preview').innerHTML=`<div class="email"><div class="email-head"><div><b>To:</b> ${to||'(not specified)'}</div><div><b>Subject:</b> ${sub}</div></div><div class="email-body"><div class="mail-banner"><div class="preview-header"><div class="preview-header-title"><div class="main">On-call Schedule</div><div class="sub">Information Lifecycle Management – <b>${label}</b><br>– <b>${escapeHtml(document.querySelector('#update').value)}</b></div></div><div class="preview-header-brand"><div class="preview-dxc">DXC</div><div class="preview-partner">Enterprise Technology<br>&amp; Innovation Partner</div></div></div></div><div class="announcement"><div>Announcements/<br>Reminders</div><div>${ann}<br><br><b>TEAM MEETING HOST: ${host} | ${escapeHtml(formatDate(md))}</b></div></div>${data.map(tablePreview).join('')}<div class="legend"><span class="key"><i class="swatch" style="background:#f4cccc"></i>VL/CDO/SL</span><span class="key"><i class="swatch" style="background:#bdd7ee"></i>12 hrs on-call</span><span class="key"><i class="swatch" style="background:#ffe699"></i>Holiday</span><span class="key"><i class="swatch" style="background:#c6e0b4"></i>Change shift</span></div><div class="footer">DXC Technology (Philippines) Inc.</div></div></div>`}
function emailHtml(){renderPreview();return document.querySelector('.email-body').innerHTML}
function generateEmailPreview(){
 try{
   renderPreview();
   const section=document.getElementById('emailPreviewSection');
   const preview=document.getElementById('preview');
   if(!preview||!preview.innerHTML.trim())throw new Error('The preview content could not be created.');
   if(section)section.scrollIntoView({behavior:'smooth',block:'start'});
   msg('Email preview generated successfully.',true);
 }catch(error){
   console.error('Email preview error:',error);
   msg('Unable to generate email preview: '+error.message,false);
 }
}
function submitSchedule(){try{renderPreview();}catch(error){console.error('Send preview error:',error);return msg('Unable to prepare the email: '+error.message,false)}let recipientList=document.querySelector('#recipients').value.split(/[;,]/).map(x=>x.trim()).filter(Boolean),bad=recipientList.filter(x=>!/^\S+@\S+\.\S+$/.test(x));if(!recipientList.length)return msg('Enter at least one recipient work email.',false);if(bad.length)return msg('Check invalid email address: '+bad.join(', '),false);let subj=document.querySelector('#subject').value,txt=document.querySelector('.email-body').innerText;location.href=`mailto:${encodeURIComponent(recipientList.join(';'))}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(txt)}`;msg('Outlook email opened. Review the schedule and select Send.',true)}
function escapeHtml(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function formatDate(x){if(!x)return '';return new Date(x+'T00:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}function msg(t,ok){let e=document.querySelector('#status');e.textContent=t;e.style.color=ok?'#067647':'#b42318'}
['month','update','host','meetingDate','recipients','subject','announcements'].forEach(id=>document.addEventListener('input',e=>{if(e.target.id===id)renderPreview()}));init();
</script></body></html>
